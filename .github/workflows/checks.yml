name: Checks

# Credential-free verification: install, render the offline wrangler fixture,
# typecheck, lint, test and build, on every pull request, linked or not. No
# database and no Stripe account: nothing here connects to either.
# `ci.yml` is the Orun pipeline beside it (plan/run with brokered Cloudflare
# and Supabase credentials, deploys on merge); it plans nothing until
# intent.yaml names a workspace.
#
# PULL REQUESTS ONLY — not pushes to main. A push to main must start exactly
# one workflow, `ci.yml`, because a bootstrap's convergence watch
# (`orun.run/watch@v1` with `sha:`) takes the newest run for the merge commit
# from ANY workflow: with this one on push too, the watch can read this run
# green while ci.yml's deploy lanes failed, and call the product converged.
# On main the convergence builds and tests everything anyway.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Templated deployables render their wrangler config from the committed
      # fixture; an unresolved wiring token fails here, not at deploy time.
      - run: pnpm run wire:fixture
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
