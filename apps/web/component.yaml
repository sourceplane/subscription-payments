apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Next.js Subscription Payments Starter — Supabase Auth, Stripe Checkout, Customer Portal and webhooks (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The Supabase project must exist before this deploys: its URL and anon key
  # are read at build time (NEXT_PUBLIC_* are inlined) and rendered into
  # wrangler vars for the Worker. The schema must be applied too: the pricing
  # page reads products/prices and the webhook writes them.
  dependsOn:
    - component: supabase
    - component: db-migrate
  secretEnv:
    # Build time, under the template's own names (`next build` inlines them).
    NEXT_PUBLIC_SUPABASE_URL: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_URL"
    NEXT_PUBLIC_SUPABASE_ANON_KEY: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_ANON_KEY"
    # Server only, never inlined into a client bundle: the admin client in
    # utils/supabase/admin.ts (webhook upserts, customer mapping) reads it as a
    # Worker secret; declaring it here lets the deploy lane set it. The two
    # Stripe secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) are the
    # product's own and are set once per environment — see .dev.vars.example.
    SUPABASE_SERVICE_ROLE_KEY: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_SERVICE_ROLE_KEY"
    # The wiring document the wrangler template is rendered from per environment.
    WIRING_SUPABASE_STAGE: "secret://subscription-payments/subscription-payments/stage/WIRING_SUPABASE"
    WIRING_SUPABASE_PROD: "secret://subscription-payments/subscription-payments/prod/WIRING_SUPABASE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: subscription-payments-web-{dev,stage,prod}.
    workerName: subscription-payments-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the wiring document, then
    # build (the verify lane already rendered from the fixture through
    # `wire:fixture`; a deploy lane re-renders with the real values). The
    # site's public origin — Stripe success/cancel URLs, auth email redirects,
    # metadataBase — is the environment's Worker URL (`getURL()` in
    # utils/helpers.ts reads NEXT_PUBLIC_SITE_URL); override it for a custom
    # domain. NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is the product's public Stripe
    # key, a build-time value to export here once it has one (empty is a valid
    # build: Checkout is simply unreachable until it is set).
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components supabase --env "${ORUN_ENVIRONMENT}" && NEXT_PUBLIC_SITE_URL="https://subscription-payments-web-${ORUN_ENVIRONMENT}.${WORKERS_DEV_SUBDOMAIN}.workers.dev" pnpm exec turbo run build --filter=@app/web

    # Smoke: the pricing page renders (with or without products) and the
    # navbar carries its link.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Pricing'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
