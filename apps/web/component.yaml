apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Next.js Subscription Payments Starter — Supabase Auth, Stripe Checkout, Customer Portal and webhooks (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP, ENFORCED ON MAIN. A merge to main converges the whole
  # product in one run: the Supabase project, then the migrations, then this
  # Worker. Its deploy reads the project's URL and keys
  # (WIRING_SUPABASE_<ENV>, rendered into wrangler.jsonc and pushed as a
  # Worker secret) and needs the schema applied, and a job resolves its
  # secrets when it STARTS — so it waits on both, `mode: enforced`, and the
  # document the supabase apply lease-published is there. A pull request
  # deploys nothing, so nothing on one waits: every edge is advisory there.
  dependsOn:
    - component: supabase
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  subscribe:
    environments:
      # dev verifies with the committed fixture render and reads no wiring.
      - name: dev
        profile: verify
      # Each deployed environment reads ITS OWN wiring document (Lumen's
      # scoping): stage never waits on prod's project to exist, and dev
      # resolves no credential it could never use.
      - name: stage
        profile: verify
        secretEnv:
          WIRING_SUPABASE_STAGE: "secret://subscription-payments/subscription-payments/stage/WIRING_SUPABASE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        secretEnv:
          WIRING_SUPABASE_PROD: "secret://subscription-payments/subscription-payments/prod/WIRING_SUPABASE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: subscription-payments-web-{dev,stage,prod}.
    workerName: subscription-payments-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # wrangler.jsonc is COMMITTED — the fixture render, so the composition's
    # structure check (`test -f wrangler.jsonc`, before the build, in a fresh
    # checkout) passes. Stage and prod re-render it here, in their own job
    # tree, from this environment's wiring document — the project URL, the
    # anon key and the Worker's origin, which `next build` inlines
    # (next.config.mjs) — then build, then hand the document's service-role
    # key to the Worker as a SECRET (tooling/wire/secrets.mjs: `wrangler
    # secret bulk`, the value over stdin). Only the deploy lane holds a
    # Cloudflare credential, so a verify lane renders and builds the same and
    # pushes nothing. dev verifies with the fixture and has no wiring.
    buildCommand: if [ "${ORUN_ENVIRONMENT}" != dev ]; then node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components supabase --env "${ORUN_ENVIRONMENT}"; fi && pnpm exec turbo run build --filter=@app/web && if [ "${ORUN_ENVIRONMENT}" != dev ]; then node ../../tooling/wire/secrets.mjs --component supabase --env "${ORUN_ENVIRONMENT}" --secret SUPABASE_SERVICE_ROLE_KEY=supabase_service_role_key --worker "subscription-payments-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc; fi

    # Smoke: the pricing page renders (its navbar carries the Pricing link,
    # with or without plans), and /api/health answers ok — the
    # Supabase project reachable with the keys the Worker was built with, the
    # schema migrated, and the service-role secret the project's own. Each
    # response is buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Pricing' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
