apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-migrate
  description: Applies database migrations to stage and prod Supabase instances
  labels:
    domain: infra
    scope: database
    team: platform
    layer: data

spec:
  type: db-migrate
  lifecycle: production
  owner: platform
  domain: infra

  # Migrations read the Supabase connection from the orun secrets the
  # `supabase` apply lease-publishes, and a job resolves its secrets when it
  # starts — so on main this waits for that apply, `mode: enforced`. The app
  # waits on this in turn: the order on main is supabase → db-migrate → web.
  # Advisory on a pull request, which applies nothing.
  dependsOn:
    - component: db
    - component: supabase
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request

  path: packages/db/src/migrations

  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    owner: sourceplane
    repo: subscription-payments

  # The migration runner's Management-API token (required in apply mode)
  # resolves from orun secrets — minted fresh per run from the Supabase
  # integration (management-access template). Replaces the ambient
  # SUPABASE_ACCESS_TOKEN CI value.
  secretEnv:
    SUPABASE_ACCESS_TOKEN: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_ACCESS_TOKEN"
    # The runner's DB identity (de-AWS — replaces the Secrets Manager read).
    SUPABASE_PROJECT_REF: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_PROJECT_REF"
    SUPABASE_DB_PASSWORD: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_DB_PASSWORD"
    SUPABASE_DB_URL: "secret://subscription-payments/subscription-payments/{{ .environment }}/SUPABASE_DB_URL"

  subscribe:
    environments:
      - name: stage
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
