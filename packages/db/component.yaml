apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db
  description: The database migrations and their runner (built by the db-migrate component before it plans or applies)
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: data
  subscribe:
    environments:
      - name: dev
        profile: quick-check
      - name: stage
        profile: quick-check
      - name: prod
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
  labels:
    team: platform
    layer: data
